[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "content-agent"
version = "0.1.0"
description = "Evidence-backed, agentic content-writing system"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Gautam Goyal", email = "gautamgoyal556@gmail.com"}]
keywords = ["fastapi", "langchain", "langgraph", "agents", "content", "postgresql", "pgvector"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

# Runtime dependencies
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "langgraph",
    "langchain",
    "sqlalchemy",
    "alembic",
    "asyncpg",
    "pgvector",
    "httpx",
    "beautifulsoup4",
    "trafilatura",
    "pyyaml",
    "python-dotenv",
]

# Development dependencies
[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

# Package discovery for src layout
[tool.setuptools.packages.find]
where = ["src"]

# Pytest configuration
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--cov=content_agent --cov-report=term-missing"
testpaths = ["tests"]

# Ruff configuration
[tool.ruff]
line-length = 88
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E", "F", "W", "C90", "N", "B", "A", "C4",
    "ISC", "ICN", "PIE", "PYI", "PT", "Q",
    "RET", "SIM", "TID", "UP", "YTT",
]
ignore = []

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"
